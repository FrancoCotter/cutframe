<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutframe smooth palette checks</title>
<style>body{margin:20px;background:#eee;font:14px Arial,sans-serif}#fixture{width:min(760px,100%);color:#222;background:#eee}pre{white-space:pre-wrap}#run{position:fixed;right:20px;top:12px;z-index:5}</style>
<button id="run">Run smooth palette checks</button><main id="fixture"><p>Host styles</p><div id="mount"></div></main><pre id="report" data-state="idle">Ready</pre>
<script type="module">
import {createCutframe,createPageAdapter} from '/src/cutframe.js';
import {contrast,parseColor,colorDistance} from '/src/palette.js';
const player=createCutframe(document.querySelector('#mount'),{source:'/media/steel/preview.mp4'});
const adapter=createPageAdapter(document.querySelector('#fixture'),player.surface,()=>{},{sampling:false,transition:{duration:800}});
adapter.refresh();
const report=document.querySelector('#report');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
const until=async(fn,label)=>{const start=performance.now();while(!fn()){if(performance.now()-start>6000)throw Error(label);await wait(20);}};
const recordFrames=async(duration)=>{
 const rows=[];const start=performance.now();
 while(performance.now()-start<duration){
  await new Promise(requestAnimationFrame);
  const dock=getComputedStyle(player.surface.querySelector('.cf-dock'));
  const text=getComputedStyle(player.surface.querySelector('.cf-time'));
  const button=getComputedStyle(player.surface.querySelector('.cf-play'));
  assert(contrast(parseColor(text.color),parseColor(dock.backgroundColor))>=4.5,'Rendered text lost contrast mid-transition');
  assert(contrast(parseColor(button.backgroundColor),parseColor(dock.backgroundColor))>=3,'Rendered accent lost contrast mid-transition');
  assert(contrast(parseColor(button.color),parseColor(button.backgroundColor))>=4.5,'Rendered play label lost contrast mid-transition');
  rows.push(adapter.renderedPalette.surface);
 }
 return rows;
};
document.querySelector('#run').onclick=async()=>{
 report.dataset.state='running';const rows=[];
 try{
  window.scrollTo(0,0);const video=player.video,volume=video.volume,paused=video.paused;
  adapter.setTheme({surface:'#111111',foreground:'#ffffff',accent:'#aacccc'});
  await until(()=>adapter.profile?.surface==='#111111'&&!adapter.transitionStats.running,'Initial palette');
  adapter.setTheme({surface:'#eeeeee',foreground:'#111111',accent:'#315a43'});
  await until(()=>adapter.profile.surface==='#eeeeee','Light target');
  const samples=await recordFrames(1100);
  await until(()=>!adapter.transitionStats.running,'Light transition did not stop');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)assert(new Set(samples).size>5,'Palette switched instantly instead of interpolating');
  assert(adapter.renderedPalette.surface==='#eeeeee','Did not reach exact target');
  rows.push({check:'Dark → light: intermediate rendered colors and per-frame text/accent contrast',colors:new Set(samples).size,stats:adapter.transitionStats});
  const idleFrames=adapter.transitionStats.frames;await wait(500);
  assert(adapter.transitionStats.frames===idleFrames,'Idle palette kept scheduling color writes');
  rows.push({check:'Idle for 500ms',additionalColorFrames:adapter.transitionStats.frames-idleFrames});
  adapter.setTheme({surface:'#281e44',foreground:'#ffffff',accent:'#d9a6aa'});
  await until(()=>adapter.profile.surface==='#281e44','Retarget first palette');
  const before=await recordFrames(220);
  adapter.setTheme({surface:'#2a5f68',foreground:'#ffffff',accent:'#e6d4af'});
  const after=await recordFrames(1400);
  await until(()=>!adapter.transitionStats.running,'Retarget did not settle');
  const colors=[...before,...after];let maxStep=0;
  for(let i=1;i<colors.length;i++)maxStep=Math.max(maxStep,colorDistance(parseColor(colors[i-1]),parseColor(colors[i])));
  assert(adapter.renderedPalette.surface==='#2a5f68','Latest target lost');
  rows.push({check:'Mid-flight retarget continues from visible colors',colors:new Set(colors).size,maxObservedLabStep:Math.round(maxStep*100)/100});
  adapter.setTheme({surface:'#dddddd',foreground:'#111111',accent:'#315a43'});
  await until(()=>adapter.profile.surface==='#dddddd','Offscreen target');
  const spacer=document.createElement('div');spacer.style.height='2000px';document.body.append(spacer);window.scrollTo(0,1400);
  await until(()=>!adapter.transitionStats.running,'Offscreen motion did not stop');
  const offscreenFrames=adapter.transitionStats.frames;await wait(350);
  assert(adapter.transitionStats.frames===offscreenFrames,'Offscreen motion kept writing');
  spacer.remove();window.scrollTo(0,0);
  rows.push({check:'Offscreen motion ends and schedules no more color frames'});
  adapter.setTransition(false);adapter.setTheme({surface:'#153829',foreground:'#ffffff',accent:'#a4d7bc'});
  await until(()=>adapter.profile.surface==='#153829','Instant target');
  assert(!adapter.transitionStats.running&&adapter.renderedPalette.surface==='#153829','Instant option animated');
  assert(adapter.samplingStats.reads===0,'Color animation caused pixel readback');
  assert(player.video===video&&video.volume===volume&&video.paused===paused,'Color animation reset playback');
  rows.push({check:'Instant option, zero scene reads, preserved video state',maxAnimationJsMs:adapter.transitionStats.maxFrameMs,note:'JS calculation + style writes only; excludes deferred style/paint/GPU work'});
  adapter.destroy();const destroyedFrames=adapter.transitionStats.frames;await wait(350);
  assert(adapter.transitionStats.frames===destroyedFrames,'Disposed motion kept writing');
  report.dataset.state='passed';report.textContent=JSON.stringify({state:'passed',rows},null,2);
 }catch(error){report.dataset.state='failed';report.textContent=JSON.stringify({state:'failed',error:error.message,rows},null,2);}
};
</script></html>
